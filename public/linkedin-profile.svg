<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - dark gradient for depth -->
  <rect width="400" height="400" fill="#0a0a0a"/>

  <!-- Subtle grid pattern for tech aesthetic -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#grid)"/>

  <!-- Terminal window - centered and larger -->
  <rect x="80" y="80" width="240" height="240" rx="12" fill="#0a0a0a" stroke="#22c55e" stroke-width="3"/>

  <!-- Terminal header dots -->
  <circle cx="105" cy="105" r="8" fill="#22c55e"/>
  <circle cx="130" cy="105" r="8" fill="#22c55e" opacity="0.6"/>
  <circle cx="155" cy="105" r="8" fill="#22c55e" opacity="0.3"/>

  <!-- Text content -->
  <text x="200" y="180" font-family="monospace" font-size="36" font-weight="bold" fill="#22c55e" text-anchor="middle">
    scratch
  </text>
  <text x="200" y="220" font-family="monospace" font-size="36" font-weight="bold" fill="#22c55e" text-anchor="middle">
    space
  </text>

  <!-- Command prompt -->
  <text x="110" y="275" font-family="monospace" font-size="24" fill="#6b7280">
    $ _dev
  </text>

  <!-- Cursor -->
  <rect x="110" y="285" width="16" height="24" fill="#22c55e" opacity="0.8"/>
</svg>
