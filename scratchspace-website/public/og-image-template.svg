<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Terminal window border -->
  <rect x="80" y="100" width="1040" height="430" rx="8" stroke="#22c55e" stroke-width="2" fill="none"/>

  <!-- Terminal header dots -->
  <circle cx="100" cy="120" r="6" fill="#22c55e"/>
  <circle cx="120" cy="120" r="6" fill="#22c55e" opacity="0.6"/>
  <circle cx="140" cy="120" r="6" fill="#22c55e" opacity="0.3"/>

  <!-- Main text -->
  <text x="600" y="250" font-family="monospace" font-size="72" font-weight="bold" fill="#ededed" text-anchor="middle">
    scratchspace.dev
  </text>

  <!-- Subtitle -->
  <text x="600" y="320" font-family="monospace" font-size="28" fill="#9ca3af" text-anchor="middle">
    Experimental Open-Source Projects
  </text>

  <!-- Command prompt line -->
  <text x="120" y="420" font-family="monospace" font-size="24" fill="#22c55e">
    <tspan fill="#22c55e">$</tspan>
    <tspan fill="#ededed" dx="10">explore --innovative</tspan>
  </text>

  <!-- Cursor -->
  <rect x="420" y="395" width="12" height="28" fill="#22c55e" opacity="0.8"/>

  <!-- Bottom text -->
  <text x="600" y="580" font-family="monospace" font-size="20" fill="#6b7280" text-anchor="middle">
    A property of RBK Strategies
  </text>
</svg>
